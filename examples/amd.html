<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iCImg AMD Example</title></head><body>
<div id="editor"></div>
<script src="../node_modules/requirejs/require.js"></script>
